name: Pruebas

on:
  push:
    branches: [ main, mejoras-entrega ]
  pull_request:
    branches: [ main ]

jobs:
  pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar PHP y extensiones
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, dom, libxml, pdo_sqlite, sqlite3
          coverage: none

      - name: Copiar archivo de entorno
        run: cp .env.example .env

      - name: Instalar dependencias de Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generar Application Key
        run: php artisan key:generate

      - name: Ejecutar pruebas automatizadas
        shell: bash
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: |
          php artisan test 2>&1 | tee resultado.txt
          status=${PIPESTATUS[0]}
          { echo '```'; tail -n 60 resultado.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $status